<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抖音数据抓取管理界面</title>
    <link rel="stylesheet" href="styles.css">
    <!-- 引入 jQuery 库 -->
    <script src="js/jquery-3.6.0.min.js"></script>
    <script src="script.js"></script>
    <!-- 引入 serializeJSON 插件 -->
    <script src="js/jquery.serializejson.min.js"></script>
</head>

<body>
<h2>抖音主页链接管理</h2>
<div>
<!-- 创建记录表单 -->
<form id="create-douyin-hao-url-form">
    <label for="douyin-hao-url">链接：</label>
    <input type="text" id="douyin-hao-url" name="url" style="width: 400px;" required>
    <label for="douyin-hao-touser">提醒人:</label>
    <input type="text" id="douyin-hao-touser" name="touser">
    <label for="douyin-keyword">品牌:</label>
    <input type="text" id="douyin-keyword" name="keyword"><br/>
    <label for="douyin-level">等级（S|A|B）:</label>
    <select id="douyin-level" name="level">
        <option value="">请选择</option>
        <option value="S">S</option>
        <option value="A">A</option>
        <option value="B">B</option>
    </select>
    <label for="douyin-hangye">行业:</label>
    <select id="douyin-hangye" name="hangye" required>
        <option value="">请选择</option>
        <option value="门窗">门窗</option>
        <option value="全屋定制">全屋定制</option>
        <option value="橱柜">橱柜</option>
        <option value="卫浴">卫浴</option>
        <option value="顶墙">顶墙</option>
        <option value="地板">地板</option>
        <option value="集成灶">集成灶</option>
        <option value="厨电">厨电</option>
        <option value="木门">木门</option>
        <option value="净水器">净水器</option>
    </select>
    是否监听主页：<input type="checkbox" name="is_listen_user" value="1">

    是否监听视频：<input type="checkbox" name="islisten" value="1">

    是否历史数据：<input type="checkbox" name="is_history" value="1">

    (<span class="red">监听选项请慎重选择，非必要不要选，影响执行效率</span>)
    是否抓取粉丝：<input type="checkbox" name="is_fans" value="1">
    (<span class="red">粉丝列表是一次性抓取</span>)
    <br/>
    <button type="submit">添加</button>
</form>
</div>
<!-- 获取所有记录表单 -->
<form id="get-all-douyin-hao-urls-form">
    <label for="douyin-hao-filter-url">链接：</label>
    <input type="text" id="douyin-hao-filter-url" name="url">
    <label for="douyin-hao-filter-status">状态（0|1）:</label>
    <input type="number" id="douyin-hao-filter-status" name="status">
    <label for="douyin-hao-filter-touser">提醒人:</label>
    <input type="text" id="douyin-hao-filter-touser" name="touser">
    <label for="douyin-hao-page">Page:</label>
    <input type="number" id="douyin-hao-page" name="page" value="1">
    <label for="douyin-hao-page-size">Page Size:</label>
    <input type="number" id="douyin-hao-page-size" name="page_size" value="10"><br/>
    <button type="submit">查询</button>
</form>
<!-- 显示结果的表格 -->
<table id="douyin-hao-urls-table">
    <thead>
        <tr>
            <th>ID</th>
            <th>链接</th>
            <th>品牌</th>
            <th>等级</th>
            <th>行业</th>
            <th>行业类型</th>
            <th>最后运行时间</th>
            <th>状态</th>
            <th>提醒人</th>
            <th>手机号</th>
            <th>介绍</th>
            <th>昵称</th>
            <th>抖音号</th>
            <th>操作</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>
<!-- 分页导航 -->
<div id="douyin-hao-urls-pagination" class="pagination"></div>
</body>
</html>
