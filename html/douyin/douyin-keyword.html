<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抖音关键词数据抓取管理界面</title>
    <link rel="stylesheet" href="styles.css">
    <!-- 引入 jQuery 库 -->
    <script src="js/jquery-3.6.0.min.js"></script>
    <script src="script.js"></script>
    <!-- 引入 serializeJSON 插件 -->
    <script src="js/jquery.serializejson.min.js"></script>
</head>

<body>
<h2>关键词采集管理</h2>
<!-- 创建记录表单 -->
<form id="create-douyin-keywords-form">
    <textarea style="width: 50%; height: 150px;" name="keywords" placeholder="输入关键词，一行一个"></textarea>
    <br>
    <input type="hidden" id="douyin-keywords-status" name="status" value="1">
    <select id="douyin-keywords-type" name="type">
        <option value="1">非广告视频</option>
        <!-- <option value="2">广告视频</option> -->
    </select>
    <button type="submit">添加</button>
</form>
<!-- 获取所有记录表单 -->
<form id="get-all-douyin-keywords-form">
    <label for="douyin-filter-keyword">关键词：</label>
    <input type="text" id="douyin-filter-keyword" name="keyword">
    <label for="douyin-filter-status">状态：</label>
    <input type="text" id="douyin-filter-status" name="status">
    <label for="douyin-filter-type">采集类型：</label>
    <select id="douyin-filter-type" name="type">
        <option value="">请选择</option>
        <option value="1">非广告视频</option>
        <!--<option value="2">广告视频</option>-->
    </select>
    <label for="douyin-page">Page:</label>
    <input type="number" id="douyin-page" name="page" value="1">
    <label for="douyin-page-size">Page Size:</label>
    <input type="number" id="douyin-page-size" name="page_size" value="10"><br>
    <button type="submit">查询</button>
</form>
<!-- 显示结果的表格 -->
<table id="douyin-keywords-table">
    <thead>
    <tr>
        <th>ID</th>
        <th>关键词</th>
        <th>采集类型</th>
        <th>状态</th>
        <th>上次运行时间</th>
        <th>上次采集数量</th>
        <th>操作</th>
    </tr>
    </thead>
    <tbody></tbody>
</table>
<!-- 分页导航 -->
<div id="douyin-keywords-pagination" class="pagination"></div>
</body>
</html>
