<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抖音数据抓取管理界面</title>
    <link rel="stylesheet" href="styles.css">
    <!-- 引入 jQuery 库 -->
    <script src="js/jquery-3.6.0.min.js"></script>
    <script src="script.js"></script>
    <!-- 引入 serializeJSON 插件 -->
    <script src="js/jquery.serializejson.min.js"></script>
    <link rel="stylesheet" href="js/jquery-ui.css">
    <script src="js/jquery-ui.min.js"></script>
    
    <script>
        $( function() {
            var liveid = getUrlParam('liveid');
            if (liveid) {
                console.log('liveid参数值为: ' + liveid);
                // 也可以在页面上显示参数值
                $('#douyin-liveid').val(liveid);
                getDouyinLiveDetail(1);
            } else {
                console.log('未找到liveid参数');
            }
            $("#updatetime_from").datepicker();
            $("#updatetime_to").datepicker();
        } );
        </script>
</head>

<body>
<h2>直播数据详情</h2>
<!-- 获取所有记录表单 -->
<form id="get-douyin-livedetail-form">
    <label for="douyin-live">直播id：</label>
    <input type="text" id="douyin-liveid" name="liveid">
    <label for="douyin-name">名称:</label>
    <input type="text" id="douyin-name" name="name">
    <label for="douyin-filter-keyword">状态:</label>
    <select id="douyin-status" name="status">
        <option value="">请选择</option>
        <option value="0">待开始</option>
        <option value="1">已完成</option>
    </select>
    更新时间：<input type="text" id="updatetime_from" name="updatetime_from"> - <input type="text" id="updatetime_to" name="updatetime_to">
    <br/>
    <label for="douyin-page">Page:</label>
    <input type="number" id="douyin-page" name="page" value="1">
    <label for="douyin-page-size">Page Size:</label>
    <input type="number" id="douyin-page-size" name="page_size" value="10"><br>
    <button type="submit">查询</button>  <button type="reset">重置</button>   <button type="button" class="export">导出</button>
</form>
<!-- 显示结果的表格 -->

<table id="douyin-livedetail-table">
    <thead>
        <tr>
            <th>ID</th>
            <th>直播id</th>
            <th>直播名称</th>
            <th>抖音昵称</th>
            <th>主页链接</th>
            <th>更新时间</th>
            <th>类型</th>
            <th>内容</th>
            <th>抖音号</th>
            <th>手机号</th>
            <th>介绍文字</th>
            <th>地址</th>
            <th>头像图片</th>
            <th>门头图片</th>
            <th>状态</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>
<!-- 分页导航 -->
<div id="douyin-livedetail-pagination" class="pagination"></div>
</body>
</html>
