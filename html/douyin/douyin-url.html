<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抖音数据抓取管理界面</title>
    <link rel="stylesheet" href="styles.css">
    <!-- 引入 jQuery 库 -->
    <script src="js/jquery-3.6.0.min.js"></script>
    <script src="script.js"></script>
    <!-- 引入 serializeJSON 插件 -->
    <script src="js/jquery.serializejson.min.js"></script>
</head>

<body>
<h2>监听视频url管理</h2>
<!-- 创建记录表单 -->
<form id="create-douyin-url-form">
    <label for="douyin-url">链接：</label>
    <input type="text" id="douyin-url" name="url" style="width: 400px;" required>
    <label for="douyin-keyword">品牌:</label>
    <input type="text" id="douyin-keyword" name="keyword" required>
    <label for="douyin-level">等级（S|A|B）:</label>
    <select id="douyin-level" name="level" required>
        <option value="">请选择</option>
        <option value="S">S</option>
        <option value="A">A</option>
        <option value="B">B</option>
    </select>
    <!-- <label for="douyin-touser">提醒人:</label>
    <input type="text" id="douyin-touser" name="touser"><br> -->
    <label for="douyin-hangye">行业:</label>
    <select id="douyin-hangye" name="hangye" required>
        <option value="">请选择</option>
        <option value="门窗">门窗</option>
        <option value="全屋定制">全屋定制</option>
        <option value="橱柜">橱柜</option>
        <option value="卫浴">卫浴</option>
        <option value="顶墙">顶墙</option>
        <option value="地板">地板</option>
        <option value="集成灶">集成灶</option>
        <option value="厨电">厨电</option>
        <option value="木门">木门</option>
        <option value="净水器">净水器</option>
    </select>
    <label for="douyin-type">监听类型:</label>
    <select id="douyin-type" name="type" required>
        <option value="">请选择</option>
        <option value="实时监听">实时监听</option>
        <option value="周期抓取">周期抓取</option>
    </select>
    <br>
    <button type="submit">添加</button>
</form>
<!-- 获取所有记录表单 -->
<form id="get-all-douyin-urls-form">
    <label for="douyin-filter-url">链接：</label>
    <input type="text" id="douyin-filter-url" name="url">
    <label for="douyin-filter-status">状态（0|1）:</label>
    <input type="number" id="douyin-filter-status" name="status">
    <label for="douyin-filter-keyword">品牌:</label>
    <input type="text" id="douyin-filter-keyword" name="keyword">
    <label for="douyin-filter-level">等级:</label>
    <input type="text" id="douyin-filter-level" name="level">
    <label for="douyin-filter-touser">状态:</label>
    <input type="text" id="douyin-filter-touser" name="touser"><br>
    <label for="douyin-filter-hangye">行业:</label>
    <input type="text" id="douyin-filter-hangye" name="hangye">
    <label for="douyin-filter-hangye-type">行业类型:</label>
    <input type="text" id="douyin-filter-type" name="type">
    <label for="douyin-filter-type">监听类型:</label>
    <input type="text" id="douyin-filter-type" name="type">
    <label for="douyin-page">Page:</label>
    <input type="number" id="douyin-page" name="page" value="1">
    <label for="douyin-page-size">Page Size:</label>
    <input type="number" id="douyin-page-size" name="page_size" value="10"><br>
    <button type="submit">查询</button>
</form>
<!-- 显示结果的表格 -->
<table id="douyin-urls-table">
    <thead>
        <tr>
            <th>ID</th>
            <th>链接</th>
            <th>品牌</th>
            <th>等级</th>
            <th>状态</th>
            <th>行业</th>
            <th>行业类型</th>
            <th>监听类型</th>
            <th>留言数</th>
            <th>最后运行时间</th>
            <th>操作</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>
<!-- 分页导航 -->
<div id="douyin-urls-pagination" class="pagination"></div>
</body>
</html>
